<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafarSathi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SafarSathi</h1>
    <p>Smart bus companion for Himachal Pradesh</p>
  </header>

  <main>
    <section id="view-home" class="view active">
      <label for="district">Choose your district</label>
      <select id="district"></select>
      <button id="downloadBtn">Download district data</button>
      <p id="status" class="note"></p>
      <h2>Buses</h2>
      <div id="busList"></div>
    </section>

    <section id="view-scan" class="view">
      <label for="busId">Bus number</label>
      <input id="busId" placeholder="e.g. HP01A1001">
      <button id="scanBtn" class="gold">Scan bus QR</button>
      <div id="reader"></div>
      <label for="stopName">Your stop</label>
      <input id="stopName" placeholder="e.g. Chhota Shimla">
      <button id="checkBtn" class="green">Check</button>
      <div id="result"></div>
    </section>

    <section id="view-alerts" class="view">
      <p class="note">Wake-me alarm comes in a later step.</p>
    </section>
  </main>

  <nav>
    <button class="tab active" data-view="view-home">Home</button>
    <button class="tab" data-view="view-scan">Scan</button>
    <button class="tab" data-view="view-alerts">Alerts</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
