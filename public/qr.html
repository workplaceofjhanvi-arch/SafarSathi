<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafarSathi QR codes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
    .card { text-align: center; border: 1px solid #ccc; padding: 12px; border-radius: 8px; width: 180px; }
    .card p { font-size: 13px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <script>
    fetch('/api/buses').then((r) => r.json()).then((buses) => {
      buses.forEach((b) => {
        const div = document.createElement('div');
        div.className = 'card';
        const box = document.createElement('div');
        div.appendChild(box);
        div.insertAdjacentHTML('beforeend', '<p><b>' + b.id + '</b><br>' + b.route_name + '</p>');
        document.body.appendChild(div);
        new QRCode(box, { text: location.origin + '/b/' + b.id, width: 140, height: 140 });
      });
    });
  </script>
</body>
</html>
